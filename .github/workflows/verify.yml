name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: npm ci --ignore-scripts
      
      - run: npm run verify
      - run: mkdir -p artifacts && node dist/src/main.js demo > artifacts/output.json && cmp samples/output.json artifacts/output.json
      - run: node --import tsx scripts/schema.ts > artifacts/input.schema.json && cmp schemas/input.schema.json artifacts/input.schema.json
      - run: python -m ruff check importer collectors && python -m mypy --strict importer collectors
      - run: python -m coverage run --branch --source=collectors -m unittest collectors.test_collectors && python -m coverage xml --omit="collectors/test_*,collectors/fixtures.py" -o artifacts/collector-coverage.xml
      - run: python -m coverage report --omit="collectors/test_*,collectors/fixtures.py" --fail-under=80
      - run: python -m unittest discover -s importer -p 'test_*.py'
      - run: python importer/normalize.py samples/aws-export.json artifacts/imported.json
      - run: node dist/src/main.js analyze artifacts/imported.json
      - run: |
          for provider in aws azure gcp; do
            python -m collectors.fixtures "$provider" --out "artifacts/synthetic-$provider.json"
            if [ "$provider" = gcp ]; then
              collector_status=0
              node dist/src/main.js analyze "artifacts/synthetic-$provider.json" > "artifacts/synthetic-$provider-analysis.json" || collector_status=$?
              test "$collector_status" -eq 2
            else
              node dist/src/main.js analyze "artifacts/synthetic-$provider.json" > "artifacts/synthetic-$provider-analysis.json"
            fi
          done
      - run: npm audit --audit-level=high
      - name: Install browser and system dependencies
        timeout-minutes: 5
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          printf '%s\n' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' 'Acquire::Retries "2";' | sudo tee /etc/apt/apt.conf.d/99-ci-network-timeouts > /dev/null
          npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: docker build -t privilegepath:ci .
      - run: node scripts/container-smoke.mjs privilegepath:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: verification-evidence
          path: |
            coverage.xml
            docs/workbench.png
            samples/output.json
            artifacts/
          if-no-files-found: warn
          retention-days: 14
